services:
  - type: web
    name: cakely
    runtime: node
    buildCommand: npm ci && npm ci --prefix frontend && npm run build:frontend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_RESET_PASSWORD
        value: "false"
      - key: EVENT_HASH_SALT
        sync: false
      - key: RULELOCK_API_URL
        sync: false
      - key: RULELOCK_API_TOKEN
        sync: false
      - key: CAKELY_SECURITY_MODE
        value: normal
      # GitHub Pages is hosted under /cakely-final, but CORS uses only its origin.
      - key: FRONTEND_URL
        value: https://charukagimhan2020-hub.github.io
